<div class="dialog-wrapper">
  <h3 mat-dialog-title>
    Cancel Appointment
  </h3>
  <mat-dialog-content>
    This action is irreversible
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>
      Keep
    </button>
    <button mat-icon-button color="warn" [mat-dialog-close]="true" cdkFocusInitial>
      <mat-icon>
        delete
      </mat-icon>
    </button>
  </mat-dialog-actions>
</div>
