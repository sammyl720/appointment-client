<table mat-table [dataSource]="dataSource" (matSortChange)="sortChange($event)" matSort class="mat-elevation-z8" #sort>

  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by first name">
      First Name
    </th>
    <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Last Name">
      Last Name
    </th>
    <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell [hidden]="responsiveState.isMobile" *matHeaderCellDef mat-sort-header
      sortActionDescription="Sort by E-Mail">
      E-Mail
    </th>
    <td mat-cell [hidden]="responsiveState.isMobile" *matCellDef="let element"> {{element.email }} </td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell [hidden]="responsiveState.isTabletOrSmaller" *matHeaderCellDef mat-sort-header
      sortActionDescription="Sort by Phone">
      Phone
    </th>
    <td mat-cell [hidden]="responsiveState.isTabletOrSmaller" *matCellDef="let element"> {{element.phone}}
    </td>
  </ng-container>
  <ng-container matColumnDef="time">
    <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by weight">
      Time
    </th>
    <td mat-cell *matCellDef="let element"> {{element.time}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row [class.--mobile-row]="responsiveState.isTabletOrSmaller" (click)="showAppointmentDetails(row)"
    *matRowDef="let row; columns: displayedColumns;">
  </tr>
</table>
