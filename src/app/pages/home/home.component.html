<div class="container">
  <div class="home-content" *ngIf="(appointmentContext$ | async) as context; else loading">
    <ng-container *ngIf="!!(context.event?.event) && !!(context.available.appointmentsLeft);">
      <app-create-appointment [openAppointments]="context.available"></app-create-appointment>
    </ng-container>
  </div>
  <ng-template #loading>
    <app-loading></app-loading>
  </ng-template>
</div>
